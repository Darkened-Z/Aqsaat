plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing: reads a keystore.properties (local path or CI secrets) if present,
// otherwise falls back to the debug key so the project still builds anywhere.
def ksPropsFile = file(System.getenv("KEYSTORE_PROPERTIES") ?: "keystore.properties")
def ksProps = new Properties()
def hasKs = ksPropsFile.exists()
if (hasKs) ksProps.load(new FileInputStream(ksPropsFile))

// Firebase Cloud Messaging (instant 'check in now' pushes). Values from the Firebase
// console's Android app config; blank = push disabled, the 6h heartbeat still works.
def fcmPropsFile = rootProject.file(System.getenv("FIREBASE_PROPERTIES") ?: "firebase.properties")
def fcmProps = new Properties()
if (fcmPropsFile.exists()) fcmProps.load(new FileInputStream(fcmPropsFile))
def fcm = { String k -> '"' + (fcmProps.getProperty(k) ?: '') + '"' }

android {
    namespace 'com.warraich.devicelock'
    compileSdk 34

    defaultConfig {
        applicationId "com.warraich.devicelock"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "1.17"
        // The shop's fixed Aqsat URL, compiled in so the phone only needs a short
        // claim code at enrollment.
        buildConfigField "String", "APP_BASE_URL", "\"https://aqsaat.vercel.app\""
        // Comma-separated Google account IDs (obfuscated Gaia IDs) of the SHOP's
        // dedicated account(s). Arms Factory Reset Protection so a recovery wipe
        // demands the shop account. Leave blank to disable. Android 11+ / supported OEMs.
        buildConfigField "String", "FRP_ACCOUNT_IDS", "\"\""
        buildConfigField "String", "FCM_APP_ID", fcm("appId")
        buildConfigField "String", "FCM_API_KEY", fcm("apiKey")
        buildConfigField "String", "FCM_PROJECT_ID", fcm("projectId")
        buildConfigField "String", "FCM_SENDER_ID", fcm("senderId")
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (hasKs) {
            release {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKs ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
